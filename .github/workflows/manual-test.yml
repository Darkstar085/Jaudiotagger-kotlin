name: Build and Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kotlin:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Run Gradle build
        run: ./gradlew build --no-daemon
